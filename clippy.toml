allow-print-in-tests = true
allow-dbg-in-tests = true
doc-valid-idents = ["macOS", "NTFS", "APFS", "ReFS", "exFAT", "WTF-8", "WTF-16", "UTF-16", "FileId", "VolumeId", ".."]

# PRD INST-02: every OS change goes through rf-ledger. Only crates/rf-ledger may suppress
# these (crates/rf-ledger/tests/policy.rs checks it). `allow-invalid` keeps crates that do
# not link an OS crate, or link it without the feature, free of "unresolved path" warnings.
disallowed-methods = [
    { path = "windows_registry::Key::create", reason = "OS changes must go through rf-ledger (PRD INST-02)", allow-invalid = true },
    { path = "windows_registry::Key::rename", reason = "OS changes must go through rf-ledger (PRD INST-02)", allow-invalid = true },
    { path = "windows_registry::Key::remove_tree", reason = "OS changes must go through rf-ledger (PRD INST-02)", allow-invalid = true },
    { path = "windows_registry::Key::remove_value", reason = "OS changes must go through rf-ledger (PRD INST-02)", allow-invalid = true },
    { path = "windows_registry::Key::set_u32", reason = "OS changes must go through rf-ledger (PRD INST-02)", allow-invalid = true },
    { path = "windows_registry::Key::set_u64", reason = "OS changes must go through rf-ledger (PRD INST-02)", allow-invalid = true },
    { path = "windows_registry::Key::set_string", reason = "OS changes must go through rf-ledger (PRD INST-02)", allow-invalid = true },
    { path = "windows_registry::Key::set_hstring", reason = "OS changes must go through rf-ledger (PRD INST-02)", allow-invalid = true },
    { path = "windows_registry::Key::set_expand_string", reason = "OS changes must go through rf-ledger (PRD INST-02)", allow-invalid = true },
    { path = "windows_registry::Key::set_expand_hstring", reason = "OS changes must go through rf-ledger (PRD INST-02)", allow-invalid = true },
    { path = "windows_registry::Key::set_multi_string", reason = "OS changes must go through rf-ledger (PRD INST-02)", allow-invalid = true },
