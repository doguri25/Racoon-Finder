    { path = "windows_registry::Key::set_bytes", reason = "OS changes must go through rf-ledger (PRD INST-02)", allow-invalid = true },
    { path = "windows_registry::Key::raw_set_bytes", reason = "OS changes must go through rf-ledger (PRD INST-02)", allow-invalid = true },
    { path = "windows_registry::OpenOptions::create", reason = "OS changes must go through rf-ledger (PRD INST-02)", allow-invalid = true },
