[package]
name = "rf-platform"
description = "OS integration: natural sort, trash, file ids, attributes, known folders, volumes, rename, directory watching."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rf-core = { version = "0.1.0", path = "../rf-core" }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSObjCRuntime"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
