[package]
name = "rf-ui"
description = "Slint screens and view models of the demo dual-pane file manager."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# `pure`: no C or assembly, so that the cross-target clippy of the development container
# builds (its Windows check has no `ml64.exe` for blake3's assembly, and its aarch64 macOS check
# no C compiler or SDK for the NEON code). It keeps the Rust SSE2/SSE4.1/AVX2 code on x86-64
# and costs AVX-512 there and NEON on ARM (Windows on ARM, Apple silicon), where BLAKE3 hashes
# about 1.5-2x slower once the disk keeps up. Checked for 0.2.0 and kept: blake3 1.8's build
# script reads no environment variable that skips its C and assembly (only its own features,
# `CC`, `CFLAGS` and `BLAKE3_CI`), and a target table keyed on a custom cfg would need every
# native build (CI and demo.yml) to pass `--cfg` in RUSTFLAGS, since the cross checks build the
# same targets. Drop it once the cross checks have target C toolchains, or when native speed
# on ARM matters more than them: CI builds natively.
blake3 = { version = "1.8.7", features = ["pure"] }
chardetng = "1.0.0"
encoding_rs = "0.8.42"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
jiff = "0.2.38"
md-5 = { version = "0.11.0", default-features = false }
opener = "0.9.0"
regex = "1.13.1"
rf-core = { version = "0.1.0", path = "../rf-core" }
rf-jobs = { version = "0.1.0", path = "../rf-jobs" }
rf-platform = { version = "0.1.0", path = "../rf-platform" }
rf-vfs = { version = "0.1.0", path = "../rf-vfs" }
serde = { version = "1.0.229", features = ["derive"] }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
# Pinned, with its build and test crates: `unstable-winit-030` (the window's focus, and bringing
# it back to the front from the tray) is not covered by Slint's semver, and the tray relies on
# Slint 1.18's own `SystemTrayIcon`. An update of Slint is a deliberate step, checked on every
# system.
slint = { version = "=1.18.1", features = ["unstable-winit-030"] }
thiserror = "2.0.21"
toml = "1.1.8"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
i-slint-core = { version = "=1.18.1", default-features = false }
tempfile = "3.27.0"

# The real tray icon, by hand (`cargo test -p rf-ui --test tray -- --ignored`): on macOS the
# icon is AppKit's, which only the main thread may make, and the test harness runs each test on
# a thread of its own, so this test has its own `main`.
[[test]]
name = "tray"
harness = false
