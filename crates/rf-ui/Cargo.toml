[package]
name = "rf-ui"
description = "Slint screens and view models of the demo dual-pane file manager."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
jiff = "0.2.38"
opener = "0.9.0"
rf-core = { version = "0.1.0", path = "../rf-core" }
rf-jobs = { version = "0.1.0", path = "../rf-jobs" }
rf-platform = { version = "0.1.0", path = "../rf-platform" }
rf-vfs = { version = "0.1.0", path = "../rf-vfs" }
serde = { version = "1.0.229", features = ["derive"] }
slint = "1.18.1"
thiserror = "2.0.21"
toml = "1.1.8"

[build-dependencies]
slint-build = "1.18.1"

[dev-dependencies]
i-slint-backend-testing = "1.18.1"
i-slint-core = { version = "1.18.1", default-features = false }
tempfile = "3.27.0"
