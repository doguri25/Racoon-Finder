# 어둡게: the dark theme of the mockup. docs/ux/themes.md says what each token means and which
# values a file may give it.

[theme]
scheme = "dark"
icon-style = "line"
marks = false

[color]
bg = "#15171A"
panel = "#1D2024"
raised = "#24282D"
text = "#E7E9EC"
muted = "#A0A7B1"
faint = "#7D848E"
border = "#2C3036"
folder = "#E0A84A"
warning = "#E0A84A"
# The light theme's accent lifted toward white (35%), so that it reads on the dark panels.
accent = "#78A1F2"
on-accent = "#0E1A33"
# 22% of the accent over the panel.
selection = "#313C51"
toast-bg = "#2C3138"
toast-text = "#F2F4F7"
toast-link = "#9DBBFF"
toast-hover = "#FFFFFF1F"
toast-pressed = "#FFFFFF33"
shadow = "#00000033"
shadow-small = "#00000029"
shadow-toast = "#0000003D"
shadow-dialog = "#00000052"
scrim = "#00000059"
scrim-light = "#00000033"

[font]
ui = ""
list = ""
mono = ""
small = 12
note = 13
body = 14
app-name = 15
heading = 16
title = 20

[size]
gap-xs = 4
gap-s = 8
gap-m = 12
gap-l = 16
row-height = 32
radius = 8
radius-large = 12
