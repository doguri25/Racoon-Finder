[package]
name = "rf-ledger"
description = "System change ledger: records every OS change with its before-state and reverts them for a clean uninstall."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rf-core = { version = "0.1.0", path = "../rf-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
toml = "1.1.8"
