[workspace]
resolver = "3"
# Libraries live in crates/, executables in apps/ (apps/README.md describes the folder).
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/doguri25/Racoon-Finder"
publish = false

[workspace.dependencies]
# Project Fluent: the words of the app in Korean and English (I18N-01·02, `rf-ui`'s `i18n`).
fluent-bundle = "0.16.0"
# Read by the tests, which compare the arguments of the two languages' messages.
fluent-syntax = "0.12.0"
unic-langid = "0.9.6"
# The system's language, which the app speaks unless its settings say otherwise.
sys-locale = "0.3.2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
