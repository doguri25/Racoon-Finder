name: CI

on:
  push:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"

jobs:
  diag:
    name: diag (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rf-platform --test trash --test trash_diag --no-run --locked
      - name: fresh-bin parallel x15
        run: |
          SID=$(whoami //user //fo csv //nh | sed 's/.*,"//; s/"//g' | tr -d '\r')
          echo "SID=$SID"
          for i in $(seq 1 15); do
            cmd //c "rd /s /q C:\\\$Recycle.Bin\\$SID" >/dev/null 2>&1 || true
            [ -e "C:/\$Recycle.Bin/$SID" ] && echo "bin still there" || echo "bin removed"
            echo "=== fresh parallel run $i"
            cargo test -q -p rf-platform --test trash --locked -- --nocapture 2>&1 | grep -E "diag|test |panicked|Err|result" || true
          done
      - name: fresh-bin serial x8
        run: |
          SID=$(whoami //user //fo csv //nh | sed 's/.*,"//; s/"//g' | tr -d '\r')
          for i in $(seq 1 8); do
            cmd //c "rd /s /q C:\\\$Recycle.Bin\\$SID" >/dev/null 2>&1 || true
            [ -e "C:/\$Recycle.Bin/$SID" ] && echo "bin still there" || echo "bin removed"
            echo "=== fresh serial run $i"
            cargo test -q -p rf-platform --test trash --locked -- --nocapture --test-threads=1 2>&1 | grep -E "diag|test |panicked|Err|result" || true
          done
