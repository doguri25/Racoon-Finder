name: CI

on:
  push:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"

jobs:
  diag:
    name: diag (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rf-platform --test trash --test trash_diag --no-run --locked
      - name: fresh-bin parallel x15
        shell: pwsh
        run: |
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          "SID=$sid"
          $bin = 'C:\$Recycle.Bin\' + $sid
          for ($i = 1; $i -le 15; $i++) {
            if (Test-Path -LiteralPath $bin) { cmd /c "rd /s /q `"$bin`"" }
            "bin present after reset: $(Test-Path -LiteralPath $bin)"
            "=== fresh parallel run $i"
            cargo test -q -p rf-platform --test trash --locked -- --nocapture 2>&1 | ForEach-Object { "$_" } | Select-String -Pattern 'diag|test |panicked|Err|result'
          }
          exit 0
      - name: fresh-bin serial x8
        shell: pwsh
        run: |
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $bin = 'C:\$Recycle.Bin\' + $sid
          for ($i = 1; $i -le 8; $i++) {
            if (Test-Path -LiteralPath $bin) { cmd /c "rd /s /q `"$bin`"" }
            "bin present after reset: $(Test-Path -LiteralPath $bin)"
            "=== fresh serial run $i"
            cargo test -q -p rf-platform --test trash --locked -- --nocapture --test-threads=1 2>&1 | ForEach-Object { "$_" } | Select-String -Pattern 'diag|test |panicked|Err|result'
          }
          exit 0
